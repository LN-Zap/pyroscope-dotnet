# Strike-specific. Not for upstreaming.
#
# Builds the patched profiler and publishes it to GHCR so that
# LN-Zap/zap-infrastructure can keep docker/pyroscope-dotnet/Dockerfile as a
# one-line mirror. Building here rather than there is deliberate: the upstream
# Dockerfile selects a per-arch manylinux base by digest, so arm64 has to be
# built on an arm64 runner. zap-infrastructure's pipeline runs on a single x86
# runner and would have to emulate it.
#
# Reverting to plain upstream remains a one-line change in zap-infrastructure:
# repoint the FROM at the upstream image and delete the tag override.

name: Strike - publish profiler to GHCR

# Tag-push rather than workflow_dispatch: dispatch is only offered for
# workflows present on the default branch, and this fork's main is kept as a
# pure mirror of the upstream release. A tag also gives a reproducible mapping
# from a commit to the image it produced.
#
#   git tag strike/1.5.1-glibc-strike.1 && git push fork strike/1.5.1-glibc-strike.1
#     -> ghcr.io/ln-zap/pyroscope-dotnet:1.5.1-glibc-strike.1
on:
  push:
    tags:
      - 'strike/*'

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/ln-zap/pyroscope-dotnet

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      DOCKER_BUILDKIT: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: 'true'
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive image tag from git tag
        id: tag
        run: echo "value=${GITHUB_REF_NAME#strike/}" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.arch }}
        run: |
          docker buildx build \
            -f Pyroscope.Dockerfile \
            --build-arg BASE_ARCH=${{ matrix.arch }} \
            --tag "${IMAGE}:${{ steps.tag.outputs.value }}-${{ matrix.arch }}" \
            --push \
            .

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # The per-arch tags stay published. They are what makes a bad arch easy to
      # pull and inspect on its own when something looks wrong in one of them.
      - name: Derive image tag from git tag
        id: tag
        run: echo "value=${GITHUB_REF_NAME#strike/}" >> "$GITHUB_OUTPUT"

      - name: Create multi-arch manifest
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:${{ steps.tag.outputs.value }}" \
            "${IMAGE}:${{ steps.tag.outputs.value }}-x86_64" \
            "${IMAGE}:${{ steps.tag.outputs.value }}-aarch64"

      # Parsed, not grepped: the raw manifest is pretty-printed, so a
      # whitespace-sensitive match reports a missing architecture for one that
      # is present. The os check skips the attestation manifests, which carry
      # architecture "unknown".
      - name: Verify both platforms are present
        run: |
          set -euo pipefail
          out=$(docker buildx imagetools inspect "${IMAGE}:${{ steps.tag.outputs.value }}" --raw)
          echo "$out"
          for arch in amd64 arm64; do
            jq -e --arg a "$arch" \
              'any(.manifests[]?; .platform.architecture == $a and .platform.os == "linux")' \
              <<<"$out" >/dev/null || { echo "missing $arch"; exit 1; }
          done
          echo "both platforms present"
